<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kostky – prototyp</title>
<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#1d232b;--muted:#6b7480;--line:#d5d9df;--red:#C8102E;--good:#2e8b57;--focus:#3D8CCD}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 10px}p{line-height:1.45}
.btn{font:inherit;font-size:18px;font-weight:600;border:0;border-radius:999px;padding:12px 24px;background:#2B3440;color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:#2B3440;border:2px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:#e6e9ee;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.bar{height:8px;background:#e1e4e8;border-radius:4px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:#2B3440;width:100%;transition:width .25s linear}
.lay{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.card{text-align:center;background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lbl{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px;text-align:center}
.model{display:flex;align-items:center;justify-content:center;min-width:150px;min-height:120px;background:#fff}
.board{display:inline-grid;gap:0;background:#e9ebee;border-radius:6px;touch-action:manipulation}
.cell{border:1px dashed #c3c8cf;background:#eef0f3;cursor:pointer;padding:0;position:relative}
.cell.on{border:1px solid #c9ccd1;background:#fff}
.cell svg{display:block;width:100%;height:100%}
.pal{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.pal button{width:min(56px,calc((100vw - 100px) / 7));height:min(56px,calc((100vw - 100px) / 7));border:3px solid var(--line);border-radius:10px;background:#fff;padding:3px;cursor:pointer}
.pal button.sel{border-color:#2B3440;box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 40%,transparent)}
.pal button svg{display:block;width:100%;height:100%}
.info{font-size:14px;color:var(--muted);text-align:center;margin-top:8px}
.ok{color:var(--good);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
.actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.hint{font-size:15px;color:var(--muted);max-width:560px;margin:8px auto 0;text-align:center}
</style></head><body><div class="wrap" id="app"></div>
<script>
const DATA = {"practice": [{"id": "P1 šachovnice", "type": "ctverec", "n": 2, "grid": ["RW", "WR"], "lines": true, "cap": 45}, {"id": "P2 schod", "type": "ctverec", "n": 2, "grid": ["RR", "WD"], "lines": true, "cap": 45}], "items": [{"id": "dum", "type": "ctverec", "n": 2, "grid": ["CD", "RR"], "lines": true, "cap": 45}, {"id": "kosoctverec2", "type": "ctverec", "n": 2, "grid": ["CD", "BA"], "lines": false, "cap": 45}, {"id": "vetrnik2", "type": "ctverec", "n": 2, "grid": ["DB", "AC"], "lines": false, "cap": 45}, {"id": "presypaci2", "type": "ctverec", "n": 2, "grid": ["BA", "CD"], "lines": false, "cap": 45}, {"id": "sipka3", "type": "ctverec", "n": 3, "grid": ["WCD", "CRR", "BRR"], "lines": false, "cap": 75}, {"id": "pas3", "type": "ctverec", "n": 3, "grid": ["RCW", "BRC", "WBR"], "lines": false, "cap": 75}, {"id": "krokev3", "type": "ctverec", "n": 3, "grid": ["DWC", "RDC", "BWA"], "lines": false, "cap": 75}, {"id": "kosoctverec3", "type": "ctverec", "n": 3, "grid": ["CRD", "RWR", "BRA"], "lines": false, "cap": 75}, {"id": "cikcak4b", "type": "ctverec", "n": 4, "grid": ["DCDC", "RRRR", "ABAB", "WWWW"], "lines": false, "cap": 120}, {"id": "krokve4", "type": "ctverec", "n": 4, "grid": ["DWWC", "BDCA", "DBAC", "BWWA"], "lines": false, "cap": 120}, {"id": "kriz_vetrnik", "type": "volne", "n": 5, "cells": [[1, 1, "R"], [0, 1, "C"], [1, 2, "D"], [2, 1, "A"], [1, 0, "B"]], "count": 5, "cap": 120}, {"id": "blesk", "type": "volne", "n": 5, "cells": [[0, 1, "C"], [0, 2, "R"], [1, 1, "R"], [1, 2, "A"], [2, 0, "R"], [2, 1, "A"]], "count": 6, "cap": 120}, {"id": "cikcak_had", "type": "volne", "n": 5, "cells": [[0, 0, "D"], [0, 1, "C"], [1, 1, "B"], [1, 2, "D"], [2, 2, "A"], [2, 3, "C"]], "count": 6, "cap": 120}, {"id": "dvojkrokev", "type": "volne", "n": 5, "cells": [[0, 0, "C"], [0, 3, "D"], [1, 1, "C"], [1, 2, "D"], [2, 0, "C"], [2, 3, "D"], [3, 1, "C"], [3, 2, "D"]], "count": 8, "cap": 120}, {"id": "raketa", "type": "volne", "n": 5, "cells": [[0, 1, "D"], [0, 2, "C"], [1, 1, "R"], [1, 2, "R"], [2, 0, "C"], [2, 1, "R"], [2, 2, "R"], [2, 3, "D"], [3, 1, "C"], [3, 2, "D"]], "count": 10, "cap": 120}, {"id": "X_ramena", "type": "volne", "n": 5, "cells": [[0, 0, "R"], [0, 3, "R"], [1, 1, "C"], [1, 2, "D"], [2, 1, "B"], [2, 2, "A"], [3, 0, "R"], [3, 3, "R"]], "count": 8, "cap": 120}]};
const TRI = {A:[[0,0],[1,0],[0,1]], B:[[0,0],[1,0],[1,1]], C:[[1,0],[1,1],[0,1]], D:[[0,0],[1,1],[0,1]]};
const QU = {W:[], R:['t','r','b','l'], A:['t','l'], B:['t','r'], C:['r','b'], D:['b','l']};   // čtvrtiny políčka (rozdělené oběma úhlopříčkami)
const TILES = ['W', 'R', 'A', 'B', 'C', 'D'];
const app = document.getElementById('app');
function tileSvg(code, s){ s = s || 40; let x = `<svg viewBox="0 0 ${s} ${s}"><rect width="${s}" height="${s}" fill="#fff"/>`;
  if (code === 'R') x += `<rect width="${s}" height="${s}" fill="var(--red)"/>`;
  else if (TRI[code]) x += `<polygon points="${TRI[code].map(([a, b]) => a * s + ',' + b * s).join(' ')}" fill="var(--red)"/>`;
  return x + `<rect width="${s}" height="${s}" fill="none" stroke="#9aa1a9" stroke-width="1.5"/></svg>`; }
function cellsOf(it){ if (it.type === 'ctverec') { const o = []; it.grid.forEach((row, i) => [...row].forEach((c, j) => o.push([i, j, c]))); return o; } return it.cells; }
function modelSvg(it, px){
  const C = cellsOf(it), R = Math.max(...C.map(c => c[0])) + 1, K = Math.max(...C.map(c => c[1])) + 1, s = Math.min(px / Math.max(R, K), 60);
  let x = `<svg width="${K * s + 4}" height="${R * s + 4}"><g transform="translate(2,2)">`;
  C.forEach(([i, j, c]) => { const X = j * s, Y = i * s;
    const E = 'fill="#C8102E" stroke="#C8102E" stroke-width="1" stroke-linejoin="miter"';   // obrys stejnou barvou: mezi kostkami nevzniknou světlé spáry
    if (c === 'R') x += `<rect x="${X}" y="${Y}" width="${s}" height="${s}" ${E}/>`;
    else if (TRI[c]) x += `<polygon points="${TRI[c].map(([a, b]) => (X + a * s) + ',' + (Y + b * s)).join(' ')}" ${E}/>`;
    if (it.lines) x += `<rect x="${X}" y="${Y}" width="${s}" height="${s}" fill="none" stroke="#8a929c" stroke-width="1"/>`; });
  if (it.type === 'ctverec') x += `<rect width="${K * s}" height="${R * s}" fill="none" stroke="#c9ced5" stroke-width="1"/>`;
  return x + '</g></svg>'; }
function redSet(cells){   // množina červených čtvrtin, posunutá do počátku
  const q = []; cells.forEach(([i, j, c]) => QU[c].forEach(k => q.push([i, j, k])));
  if (!q.length) return '';
  const mi = Math.min(...q.map(a => a[0])), mj = Math.min(...q.map(a => a[1]));
  return q.map(([i, j, k]) => (i - mi) + ',' + (j - mj) + k).sort().join(' ');
}
function diagnose(it, board){   // po neúspěchu: zarovnat na nejlepší posun a spočítat typy chyb
  const M = cellsOf(it).filter(c => c[2] !== 'W'), B = []; board.forEach((row, i) => row.forEach((c, j) => { if (c && c !== 'W') B.push([i, j, c]); }));
  let best = null;
  for (let di = -6; di <= 6; di++) for (let dj = -6; dj <= 6; dj++) {
    const map = new Map(B.map(([i, j, c]) => [(i - di) + ',' + (j - dj), c])); let hit = 0;
    M.forEach(([i, j, c]) => { if (map.get(i + ',' + j) === c) hit++; });
    if (!best || hit > best.hit) best = {hit, map}; }
  let rot = 0, col = 0, miss = 0;
  M.forEach(([i, j, c]) => { const p = best ? best.map.get(i + ',' + j) : undefined;
    if (!p) miss++; else if (p !== c) { if ('ABCD'.includes(p) && 'ABCD'.includes(c)) rot++; else col++; } });
  return {spravne_kostky:best ? best.hit : 0, chyby_natoceni:rot, chyby_barvy:col, chybejici:miss, kostek_vzor:M.length};
}
const LOG = []; let phase = 'intro', list = [], idx = 0, ST = null;
function intro(){
  app.innerHTML = `<h1>Kostky</h1><div class="card"><p style="font-size:19px">Nahoře je vzor. Poskládej ho z kostek: vyber dole kostku (bílou, červenou nebo napůl červenou v jednom ze čtyř natočení) a klepni na políčko, kam ji chceš dát. Kostku přepíšeš tak, že na políčko klepneš s jinou. Jakmile vzor sedí, položka sama skončí.</p>
  <p style="font-size:16px;color:var(--muted)">U posledních položek vzor není čtverec – postav ho kdekoliv na velké ploše. Bílé části vzoru splývají s pozadím.</p>
  <div class="actions"><button class="btn" id="go">Vyzkoušet</button><button class="btn ghost" id="skip">Rovnou položky</button></div></div>`;
  document.getElementById('go').onclick = () => { phase = 'prac'; list = DATA.practice; idx = 0; item(); };
  document.getElementById('skip').onclick = () => { phase = 'test'; list = DATA.items; idx = 0; item(); };
}
function item(){
  const it = list[idx], n = it.n, side = Math.min(innerWidth >= 900 ? 380 : innerWidth - 56, 380), cs = Math.floor(side / n);
  ST = {it, board:Array.from({length:n}, () => Array(n).fill(null)), sel:'R', t0:performance.now(), first:null, moves:[], done:false, timer:null};
  app.innerHTML = `<div class="top"><span class="pill">${phase === 'prac' ? 'Nácvik' : 'Položka ' + (idx + 1) + ' z ' + list.length}</span><span class="pill" id="clock"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="lay"><div class="card"><p class="lbl">Vzor</p><div class="model">${modelSvg(it, innerWidth >= 900 ? 240 : Math.min(170, innerWidth - 80))}</div>
    ${it.type === 'volne' ? `<p class="info">Na stavbu je potřeba ${it.count} kostek.</p>` : ''}</div>
  <div class="card"><p class="lbl">${it.type === 'volne' ? 'Postav vzor kdekoliv na ploše' : 'Tvoje stavba'}</p>
    <div class="board" id="board" style="grid-template-columns:repeat(${n},${cs}px);grid-auto-rows:${cs}px"></div>
    <div class="pal" id="pal">${TILES.map(t => `<button data-t="${t}" aria-label="kostka ${t}">${tileSvg(t)}</button>`).join('')}<button data-t="" aria-label="smazat" style="font-size:22px">⌫</button></div>
    <p class="info" id="fb"></p></div></div>
  <div class="actions"><button class="btn ghost" id="next">${phase === 'prac' ? 'Přeskočit nácvik' : 'Nevím, další'}</button></div>`;
  drawBoard(); drawPal();
  document.getElementById('pal').querySelectorAll('button').forEach(b => b.onclick = () => { ST.sel = b.dataset.t; drawPal(); });
  document.getElementById('next').onclick = () => finish(false, 'vzdal');
  const cap = it.cap * 1000; ST.timer = setInterval(() => { const el = performance.now() - ST.t0;
    document.getElementById('bar').style.width = Math.max(0, 100 - el / cap * 100) + '%'; document.getElementById('clock').textContent = Math.max(0, Math.ceil((cap - el) / 1000)) + ' s';
    if (el >= cap) finish(false, 'čas'); }, 200);
}
function drawPal(){ document.querySelectorAll('#pal button').forEach(b => b.classList.toggle('sel', b.dataset.t === ST.sel)); }
function drawBoard(){
  const el = document.getElementById('board'); el.innerHTML = '';
  ST.board.forEach((row, i) => row.forEach((c, j) => { const b = document.createElement('button'); b.className = 'cell' + (c ? ' on' : '');
    b.innerHTML = c ? tileSvg(c, 40).replace('stroke="#9aa1a9"', 'stroke="#d0d4da"') : ''; b.setAttribute('aria-label', 'políčko ' + (i + 1) + ',' + (j + 1));
    b.onclick = () => place(i, j); el.appendChild(b); }));
}
function place(i, j){
  if (ST.done) return; const t = performance.now() - ST.t0; if (ST.first === null) ST.first = t;
  ST.board[i][j] = ST.sel || null; ST.moves.push([Math.round(t), i, j, ST.sel || '-']); drawBoard();
  const B = []; ST.board.forEach((row, a) => row.forEach((c, b) => { if (c) B.push([a, b, c]); }));
  if (redSet(B) === redSet(cellsOf(ST.it))) finish(true, 'složeno');
}
function finish(ok, how){
  if (ST.done) return; ST.done = true; clearInterval(ST.timer);
  const t = Math.round(performance.now() - ST.t0), it = ST.it;
  const rec = {faze:phase, id:it.id, spravne:ok ? 1 : 0, konec:how, cas_ms:t, prvni_tah_ms:ST.first === null ? '' : Math.round(ST.first), tahu:ST.moves.length, limit_s:it.cap, tahy:ST.moves};
  if (!ok) Object.assign(rec, diagnose(it, ST.board));
  LOG.push(rec);
  const fb = document.getElementById('fb'); fb.innerHTML = ok ? '<span class="ok">✓ Složeno za ' + (t / 1000).toFixed(1) + ' s</span>' : how === 'čas' ? 'Čas vypršel.' : '';
  setTimeout(() => { idx++; if (idx < list.length) return item();
    if (phase === 'prac') { phase = 'test'; list = DATA.items; idx = 0; return ready(); } results(); }, ok ? 900 : 600);
}
function ready(){ app.innerHTML = `<h1>Teď naostro</h1><div class="card"><p style="font-size:19px">Každý vzor má časový limit. Pracuj rychle, ale hlavně přesně.</p><div class="actions"><button class="btn" id="st">Začít</button></div></div>`;
  document.getElementById('st').onclick = item; }
function results(){
  const T = LOG.filter(r => r.faze === 'test');
  app.innerHTML = `<h1>Výsledek prototypu</h1><div class="card"><p><b>Správně ${T.filter(r => r.spravne).length} z ${T.length}</b> (skóre bez bonusu za rychlost).</p>
  <table><tr><th>Položka</th><th>Výsledek</th><th>Čas</th><th>1. tah</th><th>Tahů</th><th>Chyby (natočení / barva / chybí)</th></tr>
  ${T.map(r => `<tr><td>${r.id}</td><td>${r.spravne ? '✓' : '✗ ' + r.konec}</td><td>${(r.cas_ms / 1000).toFixed(1)} s</td><td>${r.prvni_tah_ms === '' ? '–' : (r.prvni_tah_ms / 1000).toFixed(1) + ' s'}</td><td>${r.tahu}</td><td>${r.spravne ? '' : r.chyby_natoceni + ' / ' + r.chyby_barvy + ' / ' + r.chybejici}</td></tr>`).join('')}</table>
  <div class="actions"><button class="btn ghost" id="again">Znovu</button></div></div>`;
  document.getElementById('again').onclick = () => { LOG.length = 0; phase = 'intro'; intro(); };
}
intro();
</script></body></html>
